<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사주팔자 — 자동 명식 계산기</title>
<meta name="theme-color" content="#211D17">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">

  <header class="masthead">
    <p class="masthead-mark">八字</p>
    <h1>사주팔자</h1>
    <p class="masthead-sub">생년월일시 여덟 글자로 뽑는 명식</p>
  </header>

  <form id="form" class="card form-card">
    <div class="field">
      <label for="name">이름</label>
      <input type="text" id="name" placeholder="이름을 적어주세요" autocomplete="off">
    </div>

    <div class="field-row">
      <div class="field">
        <span class="label-like">달력</span>
        <div class="segmented" id="calType">
          <button type="button" class="seg-btn is-active" data-val="solar">양력</button>
          <button type="button" class="seg-btn" data-val="lunar">음력</button>
        </div>
      </div>
      <div class="field">
        <span class="label-like">성별</span>
        <div class="segmented" id="gender">
          <button type="button" class="seg-btn is-active" data-val="1">남</button>
          <button type="button" class="seg-btn" data-val="0">여</button>
        </div>
      </div>
    </div>

    <div class="field-row">
      <div class="field grow">
        <label for="date">생년월일</label>
        <input type="date" id="date" required min="1900-01-01" max="2035-12-31">
      </div>
      <div class="field" id="leapField" hidden>
        <label class="checkbox-label"><input type="checkbox" id="leap"> 윤달</label>
      </div>
    </div>

    <div class="field-row">
      <div class="field grow">
        <label for="time">태어난 시각</label>
        <input type="time" id="time">
      </div>
      <div class="field">
        <label class="checkbox-label"><input type="checkbox" id="timeUnknown"> 시간 모름</label>
      </div>
    </div>

    <button type="submit" class="submit-btn">사주 보기</button>
    <p class="form-note">계산은 이 기기 안에서만 이루어지고 어디로도 전송되지 않습니다.</p>
  </form>

  <section id="result" class="result" hidden>

    <div class="result-heading">
      <h2 id="resultName">사주</h2>
      <p id="resultMeta"></p>
    </div>

    <div class="card pillars-card">
      <div class="pillars" id="pillars"></div>
    </div>

    <div class="card">
      <h3 class="section-title">오행 분포</h3>
      <div class="wuxing" id="wuxing"></div>
      <p class="reading-line" id="strengthLine"></p>
    </div>

    <div class="card">
      <h3 class="section-title">십성 배치</h3>
      <div class="table-wrap">
        <table class="sipsung-table" id="sipsungTable"></table>
      </div>
    </div>

    <div class="card">
      <h3 class="section-title">풀이</h3>
      <ul class="reading-list" id="readingList"></ul>
      <p class="disclaimer">전통 명리학의 상징 체계를 기계적으로 계산한 참고용 결과입니다. 삶의 방향을 정하는 근거보다는 스스로를 돌아보는 도구로 봐주세요.</p>
    </div>

    <div class="card">
      <h3 class="section-title">대운</h3>
      <p class="daewoon-meta" id="daewoonMeta"></p>
      <div class="table-wrap">
        <table class="daewoon-table" id="daewoonTable"></table>
      </div>
    </div>

    <button type="button" class="reset-btn" id="resetBtn">다시 보기</button>

  </section>

</div>

<script src="lunar.js"></script>
<script src="app.js"></script>
</body>
</html>
